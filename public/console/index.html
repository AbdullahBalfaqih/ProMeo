<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ProMeo · Agent Procurement Network</title>
<link rel="icon" href="/assets/logo.png" />
<style>
  @font-face {
    font-family: "Inter";
    src: url("/fonts/InterVariable.woff2") format("woff2");
    font-weight: 100 900;
    font-display: swap;
  }

  :root {
    --page-1: #b6a0f3;
    --page-2: #967dee;
    --band-1: #e6dcfc;
    --band-2: #cfbcf8;
    --card: #ffffff;
    --ink: #241b45;
    --ink-soft: #463d6e;
    --muted: #7d76a0;
    --line: rgba(84, 58, 170, 0.14);
    --line-strong: rgba(84, 58, 170, 0.26);
    --purple: #6d3fea;
    --purple-2: #8b5cf6;
    --purple-3: #b49cff;
    --lav: #efe9ff;
    --grad-card: linear-gradient(165deg, #c9a6fb 0%, #a678f2 55%, #8f55ea 100%);
    --grad-btn: linear-gradient(135deg, #8659f4 0%, #6d3fea 62%, #5a2fd6 100%);
    --shadow: 0 18px 44px rgba(58, 34, 130, 0.16);
    --shadow-sm: 0 8px 22px rgba(58, 34, 130, 0.12);
    --r-xl: 30px;
    --r-lg: 24px;
    --r-md: 16px;
    --r-sm: 12px;
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: radial-gradient(1100px 700px at 82% -12%, #d3c2fa 0%, transparent 60%), linear-gradient(160deg, var(--page-1) 0%, var(--page-2) 100%) fixed;
    color: var(--ink);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.55;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
  }

  ::selection { background: rgba(109, 63, 234, 0.3); color: #241b45; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(84, 58, 170, 0.28); border-radius: 99px; border: 2px solid transparent; background-clip: content-box; }

  a { color: var(--purple); text-decoration: none; }
  a:hover { color: #5a2fd6; }
  h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.03em; color: var(--ink); }
  h1 { font-size: 22px; }
  h2 { font-size: 16px; }
  h3 { font-size: 13.5px; }
  p { margin: 0; }

  .muted { color: var(--muted); }
  .mono { font-family: var(--mono); font-size: 12px; letter-spacing: 0; }

  svg.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
  .ric { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .ric.fill { fill: currentColor; stroke: none; }

  #app {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: grid;
    grid-template-columns: 92px minmax(0, 1fr);
    gap: 18px;
    max-width: 1680px;
    margin: 0 auto;
    padding: 18px 22px 26px 18px;
  }

  /* ============ Floating icon rail ============ */
  .rail {
    position: sticky;
    top: 18px;
    align-self: start;
    height: calc(100vh - 36px);
    min-height: 640px;
    border-radius: var(--r-xl);
    background: rgba(255, 255, 255, 0.66);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    border: 1px solid rgba(255, 255, 255, 0.75);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 16px 0 14px;
  }
  .rail-logo {
    width: 50px;
    height: 50px;
    border-radius: 16px;
    background: var(--grad-btn);
    display: grid;
    place-items: center;
    box-shadow: 0 10px 24px rgba(109, 63, 234, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    margin-bottom: 10px;
    flex: none;
  }
  .rail-logo img { width: 26px; height: 26px; }
  .rail-sep { width: 34px; height: 1px; background: rgba(84, 58, 170, 0.16); margin: 4px 0 6px; }
  .rail-btns { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; padding: 2px 0; scrollbar-width: none; }
  .rail-btns::-webkit-scrollbar { display: none; }
  .rail-btn {
    position: relative;
    width: 50px;
    height: 46px;
    border-radius: 15px;
    border: 1px solid transparent;
    background: transparent;
    color: #6b6195;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: all 0.18s ease;
  }
  .rail-btn:hover { background: rgba(109, 63, 234, 0.1); color: var(--ink); }
  .rail-btn[aria-selected="true"] {
    background: var(--grad-btn);
    color: #ffffff;
    box-shadow: 0 10px 22px rgba(109, 63, 234, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.3);
  }
  .rail-btn .rail-tip {
    position: absolute;
    left: 60px;
    top: 50%;
    transform: translateY(-50%) translateX(-4px);
    padding: 6px 12px;
    border-radius: 10px;
    background: #1c1436;
    color: #ffffff;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: all 0.16s ease;
    z-index: 30;
    box-shadow: 0 10px 24px rgba(20, 10, 50, 0.35);
  }
  .rail-btn:hover .rail-tip { opacity: 1; transform: translateY(-50%) translateX(0); }
  .rail-foot { margin-top: auto; }
  .rail-foot .rail-btn { color: #6b6195; }

  /* ============ Main column ============ */
  .main-col { min-width: 0; display: flex; flex-direction: column; gap: 16px; }

  .appbar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 4px 6px 0;
    flex-wrap: wrap;
  }
  .appbar-title { display: inline-flex; align-items: center; gap: 10px; }
  .appbar-title h1 { font-size: 21px; font-weight: 600; }
  .mark-chip {
    width: 28px;
    height: 28px;
    border-radius: 9px;
    background: var(--grad-btn);
    display: grid;
    place-items: center;
    box-shadow: 0 6px 16px rgba(109, 63, 234, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    flex: none;
  }
  .mark-chip img { width: 16px; height: 16px; }
  .appbar-sub { font-size: 12.5px; color: rgba(36, 27, 69, 0.66); font-weight: 500; }
  .spacer { flex: 1; }
  .appbar-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  .icon-btn {
    position: relative;
    width: 44px;
    height: 44px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.8);
    background: rgba(255, 255, 255, 0.72);
    color: var(--ink-soft);
    display: grid;
    place-items: center;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: all 0.16s ease;
  }
  .icon-btn:hover { background: #ffffff; color: var(--purple); }
  .icon-btn .dot-badge {
    position: absolute;
    top: -5px;
    right: -5px;
    min-width: 19px;
    height: 19px;
    padding: 0 5px;
    border-radius: 999px;
    background: var(--grad-btn);
    color: #ffffff;
    font-size: 10.5px;
    font-weight: 600;
    display: grid;
    place-items: center;
    border: 2px solid #cdb9f6;
  }

  .addr-chip {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    height: 44px;
    padding: 0 8px 0 16px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.8);
    background: rgba(255, 255, 255, 0.72);
    box-shadow: var(--shadow-sm);
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .addr-chip .copy-btn {
    width: 32px;
    height: 32px;
    border-radius: 999px;
    border: none;
    background: rgba(109, 63, 234, 0.1);
    color: var(--purple);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .addr-chip .copy-btn:hover { background: var(--grad-btn); color: #ffffff; }
  .addr-chip .copy-btn .ric { width: 14px; height: 14px; }

  .avatar-chip {
    width: 44px;
    height: 44px;
    border-radius: 999px;
    border: 2px solid rgba(255, 255, 255, 0.9);
    background: var(--grad-card);
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    display: grid;
    place-items: center;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: transform 0.16s ease;
  }
  .avatar-chip:hover { transform: translateY(-1px); }

  /* ============ Lavender content band ============ */
  .band {
    border-radius: var(--r-xl);
    background: linear-gradient(180deg, var(--band-1) 0%, var(--band-2) 100%);
    border: 1px solid rgba(255, 255, 255, 0.55);
    box-shadow: var(--shadow);
    padding: 20px;
    min-width: 0;
  }

  /* ============ Overview hero ============ */
  .hero-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
  .hcard {
    position: relative;
    border-radius: var(--r-lg);
    background: var(--grad-card);
    border: 1px solid rgba(255, 255, 255, 0.45);
    box-shadow: 0 18px 40px rgba(109, 63, 234, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.4);
    padding: 20px;
    color: #ffffff;
    min-height: 168px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .hcard:hover { transform: translateY(-3px); box-shadow: 0 24px 52px rgba(109, 63, 234, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.4); }
  .hcard .hcard-label { font-size: 13px; font-weight: 500; color: rgba(255, 255, 255, 0.85); }
  .hcard .hcard-value { font-size: 30px; font-weight: 600; letter-spacing: -0.03em; margin-top: 4px; }
  .hcard .hcard-chip {
    position: relative;
    z-index: 2;
    margin-top: auto;
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 4px 11px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.4);
    font-size: 11.5px;
    font-weight: 500;
    color: #ffffff;
  }
  .hcard .hcard-chip .cdot { width: 6px; height: 6px; border-radius: 999px; background: #ffffff; box-shadow: 0 0 8px rgba(255, 255, 255, 0.9); }
  .glass-ic { position: absolute; right: -6px; bottom: -10px; width: 130px; height: 130px; opacity: 0.9; pointer-events: none; }

  .hero-main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: stretch; }

  .white-card {
    background: var(--card);
    border: 1px solid rgba(255, 255, 255, 0.9);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow);
    padding: 20px;
    min-width: 0;
  }

  .chart-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 8px; }
  .chart-title { display: inline-flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; color: var(--ink); }
  .chart-big { font-size: 40px; font-weight: 600; letter-spacing: -0.04em; color: var(--ink); line-height: 1.1; margin: 6px 0 2px; }
  .range-pills { display: inline-flex; gap: 6px; align-items: center; }
  .rpill {
    min-width: 40px;
    height: 34px;
    padding: 0 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: #faf8ff;
    color: var(--ink-soft);
    font-family: var(--font);
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .rpill:hover { border-color: var(--purple-3); color: var(--purple); }
  .rpill[aria-pressed="true"] { background: #1c1436; border-color: #1c1436; color: #ffffff; }
  .chart-wrap svg { display: block; width: 100%; }

  /* ============ Right action panel ============ */
  .side-panel { display: flex; flex-direction: column; gap: 14px; }
  .stab-row { display: flex; gap: 20px; padding: 2px 4px 0; }
  .stab {
    position: relative;
    border: none;
    background: none;
    padding: 6px 2px 12px;
    font-family: var(--font);
    font-size: 14.5px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    transition: color 0.15s ease;
  }
  .stab:hover { color: var(--ink-soft); }
  .stab[aria-selected="true"] { color: var(--ink); font-weight: 600; }
  .stab[aria-selected="true"]::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 2px;
    transform: translateX(-50%);
    width: 5px;
    height: 5px;
    border-radius: 999px;
    background: var(--purple);
    box-shadow: 0 0 8px rgba(109, 63, 234, 0.8);
  }

  .gauge-box { display: grid; place-items: center; padding: 4px 0 2px; }
  .gauge-inner { position: relative; width: 188px; height: 168px; }
  .gauge-inner svg { position: absolute; inset: 0; }
  .gauge-num { position: absolute; left: 0; right: 0; top: 54px; text-align: center; font-size: 26px; font-weight: 600; letter-spacing: -0.03em; color: var(--ink); }
  .gauge-sub { position: absolute; left: 0; right: 0; top: 88px; text-align: center; font-size: 12px; color: var(--muted); font-weight: 500; }

  .q-label { font-size: 13px; font-weight: 600; color: var(--ink); }
  .q-label small { float: right; font-size: 11.5px; color: var(--muted); font-weight: 500; }
  .input-pill { position: relative; margin-top: 7px; }
  .input-pill input {
    width: 100%;
    height: 48px;
    padding: 0 66px 0 16px;
    border-radius: 999px;
    border: 1px solid var(--line-strong);
    background: #ffffff;
    color: var(--ink);
    font-family: var(--font);
    font-size: 13.5px;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .input-pill input:focus { border-color: var(--purple-2); box-shadow: 0 0 0 4px rgba(109, 63, 234, 0.16); }
  .input-pill .inner-btn {
    position: absolute;
    right: 6px;
    top: 6px;
    height: 36px;
    padding: 0 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: #ffffff;
    color: var(--ink);
    font-family: var(--font);
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(58, 34, 130, 0.12);
    transition: all 0.15s ease;
  }
  .input-pill .inner-btn:hover { background: var(--lav); border-color: var(--purple-3); color: var(--purple); }

  .pill-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .pill-opt {
    height: 38px;
    padding: 0 16px;
    border-radius: 999px;
    border: 1px solid var(--line-strong);
    background: #ffffff;
    color: var(--ink-soft);
    font-family: var(--font);
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .pill-opt:hover { border-color: var(--purple-3); }
  .pill-opt[aria-pressed="true"] { background: #1c1436; border-color: #1c1436; color: #ffffff; box-shadow: 0 8px 18px rgba(20, 12, 50, 0.25); }

  .q-rows { display: flex; flex-direction: column; }
  .q-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    padding: 12px 4px;
    border: none;
    border-bottom: 1px solid var(--line);
    background: none;
    font-family: var(--font);
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-soft);
    cursor: pointer;
    text-align: left;
    transition: color 0.15s ease;
  }
  .q-row:hover { color: var(--purple); }
  .q-row .q-val { color: var(--ink); font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
  .q-row .ric { width: 15px; height: 15px; color: var(--muted); }

  .btn-dark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    height: 52px;
    border-radius: 999px;
    border: 1px solid #14101f;
    background: #14101f;
    color: #ffffff;
    font-family: var(--font);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.01em;
    cursor: pointer;
    transition: all 0.18s ease;
    box-shadow: 0 14px 30px rgba(20, 12, 50, 0.35);
  }
  .btn-dark:hover:not(:disabled) { background: #251c44; border-color: #251c44; transform: translateY(-1px); }
  .btn-dark:disabled { opacity: 0.45; cursor: not-allowed; }

  .quick-list { display: flex; flex-direction: column; gap: 8px; }
  .quick-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 11px 13px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: #faf8ff;
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .quick-item b { color: var(--ink); font-weight: 600; display: block; font-size: 12.5px; }
  .quick-item .mono { color: var(--muted); }

  /* ============ Generic page scaffolding ============ */
  .page-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .page-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 13px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.65);
    border: 1px solid rgba(255, 255, 255, 0.85);
    font-size: 12px;
    font-weight: 600;
    color: var(--purple);
    box-shadow: var(--shadow-sm);
    margin-bottom: 10px;
  }
  .page-eyebrow svg { width: 12px; height: 12px; fill: var(--purple); }
  .page-head p { color: var(--ink-soft); max-width: 640px; }
  .page-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  .grid { display: grid; gap: 16px; }
  .g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .g-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .g-sidebar-right { grid-template-columns: minmax(0, 1.55fr) minmax(340px, 1fr); }
  .g-sidebar-left { grid-template-columns: minmax(330px, 0.95fr) minmax(0, 1.55fr); }
  @media (max-width: 1180px) {
    .g-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .g-3, .g-sidebar-right, .g-sidebar-left, .hero-main, .hero-cards { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--card);
    border: 1px solid rgba(255, 255, 255, 0.9);
    border-radius: var(--r-lg);
    padding: 20px;
    box-shadow: var(--shadow);
    min-width: 0;
  }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .card-sub { font-size: 12.5px; color: var(--muted); margin-top: 3px; }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 9px 18px;
    border-radius: 999px;
    border: 1px solid var(--line-strong);
    background: #ffffff;
    color: var(--ink);
    font-family: var(--font);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.16s ease;
    text-decoration: none;
    white-space: nowrap;
    box-shadow: var(--shadow-sm);
  }
  .btn:hover:not(:disabled) { border-color: var(--purple-3); color: var(--purple); transform: translateY(-1px); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn.primary {
    background: var(--grad-btn);
    border-color: rgba(255, 255, 255, 0.35);
    color: #ffffff;
    box-shadow: 0 12px 26px rgba(109, 63, 234, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.3);
  }
  .btn.primary:hover:not(:disabled) { color: #ffffff; box-shadow: 0 16px 34px rgba(109, 63, 234, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.35); }
  .btn.subtle { background: var(--lav); border-color: rgba(109, 63, 234, 0.22); color: var(--purple); }
  .btn.subtle:hover:not(:disabled) { background: #e4d9ff; color: #5a2fd6; }
  .btn.sm { padding: 6px 13px; font-size: 12px; }
  .btn .orb {
    width: 20px;
    height: 20px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.22);
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .btn:not(.primary) .orb { background: rgba(109, 63, 234, 0.12); }
  .btn .orb svg { width: 11px; height: 11px; fill: currentColor; }
  .btn.primary .orb svg { fill: #ffffff; }

  /* Badges */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 11px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 500;
    line-height: 1.5;
    background: rgba(36, 27, 69, 0.05);
    border: 1px solid rgba(36, 27, 69, 0.14);
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 999px; background: currentColor; opacity: 0.75; }
  .badge.tone-active { background: rgba(109, 63, 234, 0.12); border-color: rgba(109, 63, 234, 0.32); color: #5a2fd6; }
  .badge.tone-bright { background: var(--grad-btn); border-color: rgba(255, 255, 255, 0.35); color: #ffffff; box-shadow: 0 6px 16px rgba(109, 63, 234, 0.4); }
  .badge.tone-muted { background: rgba(36, 27, 69, 0.04); border-color: rgba(36, 27, 69, 0.1); color: var(--muted); }

  /* Tables */
  .table-wrap { overflow-x: auto; border-radius: var(--r-md); border: 1px solid var(--line); background: #ffffff; }
  table { width: 100%; border-collapse: collapse; text-align: left; }
  th {
    padding: 11px 14px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--muted);
    background: #f6f2ff;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;

  td {
    padding: 12px 14px;
    font-size: 13px;
    color: var(--ink-soft);
    border-bottom: 1px solid rgba(84, 58, 170, 0.08);
    vertical-align: middle;
  }
  tr:last-child td { border-bottom: none; }
  tbody tr { transition: background 0.12s ease; }
  tbody tr:hover { background: rgba(109, 63, 234, 0.05); }
  tbody tr.clickable { cursor: pointer; }

  /* Forms */
  .field { margin-bottom: 14px; }
  label { display: block; font-size: 12.5px; font-weight: 500; color: var(--ink-soft); margin-bottom: 6px; }
  input, select, textarea {
    width: 100%;
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid var(--line-strong);
    background: #ffffff;
    color: var(--ink);
    font-family: var(--font);
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--purple-2); box-shadow: 0 0 0 4px rgba(109, 63, 234, 0.14); }
  textarea { min-height: 78px; resize: vertical; }
  .field-hint { font-size: 11.5px; color: var(--muted); margin-top: 4px; }

  .sep { height: 1px; background: var(--line); margin: 16px 0; }

  .kv-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .kv-item { padding: 11px 14px; border-radius: 13px; background: #faf8ff; border: 1px solid var(--line); }
  .kv-item .k { font-size: 11.5px; color: var(--muted); margin-bottom: 2px; }
  .kv-item .v { font-size: 13px; font-weight: 500; color: var(--ink); word-break: break-all; }

  .step-flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
  @media (max-width: 960px) { .step-flow { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .step-box { padding: 15px; border-radius: 16px; background: #faf8ff; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
  .step-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    border-radius: 999px;
    background: var(--grad-btn);

    font-weight: 600;

  .load-box { padding: 40px 18px; text-align: center; color: #ffffff; font-size: 13.5px; font-weight: 500; }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(28, 18, 58, 0.42);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;

  .modal-card {
    width: 100%;
    max-width: 540px;
    max-height: 86vh;
    overflow-y: auto;
    background: #ffffff;
    border: 1px solid rgba(255, 255, 255, 0.9);
    border-radius: var(--r-lg);
    padding: 24px;
    box-shadow: 0 30px 80px rgba(20, 10, 50, 0.4);
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    max-width: min(460px, calc(100vw - 32px));
    padding: 12px 20px;
    border-radius: 999px;
    background: #1c1436;
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #ffffff;
    font-size: 13px;
    font-weight: 500;
    box-shadow: 0 18px 44px rgba(20, 10, 50, 0.45);
    text-align: center;
  }

  /* Responsive shell */
  @media (max-width: 900px) {
    #app { grid-template-columns: 68px minmax(0, 1fr); gap: 12px; padding: 12px 12px 18px; }
    .rail { padding: 12px 0 10px; }
    .rail-btn { width: 44px; height: 42px; }
    .band { padding: 14px; }

<script>
"use strict";

/* Safe storage wrapper so cross-origin iframe restrictions never break boot */
const store = {
  mem: {},
  get(k) {
    try { return window.sessionStorage.getItem(k) || this.mem[k] || ""; }
    catch { return this.mem[k] || ""; }
  },
  set(k, v) {
    this.mem[k] = v;
    try { window.sessionStorage.setItem(k, v); } catch {}
  },
  del(k) {
    delete this.mem[k];
    try { window.sessionStorage.removeItem(k); } catch {}
  }
};

const state = {
  token: store.get("apn.token"),
  org: null,
  role: null,
  principalKind: "user",
  meta: null,
  health: null,
  demoPrincipals: null,
  tab: "overview",
  range: "w",
  qcCat: "cloud_infrastructure",
  chartData: [],
  overviewData: null,
  selectedRequestId: null,
  selectedAgreementId: null,
  selectedAgentId: null,
  counts: {
    requests: 0,
    approvals: 0,
    agreements: 0,
    disputes: 0,
    agents: 0,
    vendors: 0,
    policies: 0,
    webhooks: 0,
  }
};

const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* Convert any enum, status, or identifier into natural Title Case with zero all-caps words */
function cleanCase(input) {
  const raw = String(input ?? "").trim();
  if (!raw) return "—";
  const map = {
    MUSD: "Musd",
    musd: "Musd",
    ALLOW: "Allow",
    DENY: "Deny",
    REQUIRE_HUMAN_APPROVAL: "Require Human Approval",
    require_human_approval: "Require Human Approval",
    pending_approval: "Pending Approval",
    cloud_infrastructure: "Cloud Infrastructure",
    ai_services: "Managed Intelligence",
    professional_services: "Professional Services",
    per_request: "Per Request",
    ai_agent: "Autonomous Agent",
  };
  if (map[raw]) return map[raw];
  return raw
    .replace(/[_-]+/g, " ")
    .split(/\s+/)
    .map((w) => {
      if (!w) return "";
      if (w.toUpperCase() === "MUSD") return "Musd";
      return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
    })
    .join(" ");
}

function cleanRef(ref) {
  if (!ref) return "—";
  return String(ref).replace(/^REQ-/i, "Ref #");
}

function landingHref() {
  if (location.port === "4000") return location.protocol + "//" + location.hostname + ":3000/";
  if (location.hostname.startsWith("4000-")) return location.protocol + "//" + location.hostname.replace(/^4000-/, "3000-") + "/";
  return "/";
}

async function copyText(t) {
  try {
    await navigator.clipboard.writeText(t);
    toast("Copied to clipboard");
  } catch {
    try {
      const ta = document.createElement("textarea");
      ta.value = t;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
      toast("Copied to clipboard");
    } catch { toast(t); }
  }
}

function sparkBtn(id, label, sm = false) {
  return `<button class="btn primary ${sm ? "sm" : ""}" id="${esc(id)}" type="button">
    <span class="orb"><svg><use href="#i-spark"/></svg></span>
    <span>${esc(label)}</span>
  </button>`;
}

function badge(status) {
  const s = String(status ?? "").toLowerCase();
  let tone = "tone-muted";
  if (["open", "approved", "active", "funded", "accepted", "delivered", "released", "verified", "allow", "valid", "resolved"].includes(s)) {
    tone = "tone-active";
  } else if (["pending", "pending_approval", "proposed", "disputed", "require_human_approval"].includes(s)) {
    tone = "tone-bright";
  }
  return `<span class="badge ${tone}">${esc(cleanCase(status))}</span>`;
}

function toast(msg) {
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

const fmt = (baseUnits, dec = 18) => {
  try {
    const s = String(baseUnits ?? "0");
    if (s.includes(".")) return s;
    const v = BigInt(s);
    const d = 10n ** BigInt(dec);
    const whole = v / d;
    const frac = (v % d).toString().padStart(dec, "0").slice(0, 2);
    return whole.toLocaleString("en-US") + (frac === "00" ? "" : "." + frac);
  } catch {
    return String(baseUnits ?? "0");
  }
};

const fmtCompact = (baseUnits) => {
  const n = Number(fmt(baseUnits).replace(/,/g, "")) || 0;
  return n.toLocaleString("en-US", { maximumFractionDigits: 0 });
};

const toBaseUnits = (val) => {
  const clean = String(val ?? "0").trim();
  if (!clean) return "0";
  if (clean.length > 14 && /^\d+$/.test(clean)) return clean;
  const [w, f = ""] = clean.split(".");
  const whole = BigInt(w || "0") * 10n ** 18n;
  const frac = BigInt((f + "0".repeat(18)).slice(0, 18));
  return (whole + frac).toString();
};

const when = (iso) => (iso ? new Date(iso).toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" }) : "—");
const short = (h, n = 10) => (h && h.length > n + 6 ? h.slice(0, n) + "…" + h.slice(-6) : h || "—");

function field(id, label, opts = {}) {
  const { type = "text", value = "", placeholder = "", hint = "" } = opts;
  return `<div class="field">
    <label for="${esc(id)}">${esc(label)}</label>
    <input id="${esc(id)}" type="${esc(type)}" value="${esc(value)}" placeholder="${esc(placeholder)}" autocomplete="off" />
    ${hint ? `<div class="field-hint">${esc(hint)}</div>` : ""}
  </div>`;
}

async function api(method, path, body, customToken, isRetry = false) {
  const tok = customToken || state.token;
  const headers = {
    accept: "application/json",
    ...(body !== undefined ? { "content-type": "application/json" } : {}),
    ...(tok ? { authorization: "Bearer " + tok } : {}),
  };
  if (method === "POST") {
    headers["idempotency-key"] = "ui-" + Date.now() + "-" + Math.random().toString(36).slice(2, 9);
  }
  const res = await fetch("/v1" + path, {
    method,
    headers,
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  const text = await res.text();
  let json = null;
  try { json = text ? JSON.parse(text) : null; } catch { json = null; }

  /* Auto-heal stale token on 401 so user is never locked out */
  if (res.status === 401 && !isRetry && !customToken) {
    const bootRes = await fetch("/v1/bootstrap/status?ensure=1").then((r) => r.json()).catch(() => null);
    if (bootRes?.demoPrincipals?.northwind_owner) {
      state.demoPrincipals = bootRes.demoPrincipals;
      state.token = bootRes.demoPrincipals.northwind_owner;
      store.set("apn.token", state.token);
      return api(method, path, body, state.token, true);
    }
  }

  if (!res.ok) {
    const e = new Error(json?.error?.message || res.status + " " + res.statusText);
    e.code = json?.error?.code;
    e.details = json?.error?.details;
    throw e;
  }
  return json;
}

const NAV_ITEMS = [
  ["overview", "Overview", "i-home", null],
  ["requests", "Procurement Requests", "i-doc", "requests"],
  ["approvals", "Approvals Queue", "i-check", "approvals"],
  ["agreements", "Escrow & Settlement", "i-lock", "agreements"],
  ["disputes", "Disputes & Arbitration", "i-scale", "disputes"],
  ["agents", "Agents & Budgets", "i-bot", "agents"],
  ["vendors", "Vendors & Services", "i-store", "vendors"],
  ["policies", "Policy Engine", "i-sliders", "policies"],
  ["org", "Organization & Access", "i-org", null],
  ["keys", "Credentials & Keys", "i-key", null],
  ["webhooks", "Webhooks & Audit", "i-bolt", "webhooks"],
];

const NAV_LABELS = Object.fromEntries(NAV_ITEMS.map(([id, label]) => [id, label]));

async function refreshCounts() {
  try {
    const [reqs, aprs, agrs, dsps, ags, vnds, pols, whs] = await Promise.all([
      api("GET", "/requests?limit=50").catch(() => ({ data: [] })),
      api("GET", "/approvals?status=pending&limit=50").catch(() => ({ data: [] })),
      api("GET", "/agreements?limit=50").catch(() => ({ data: [] })),
      api("GET", "/disputes?limit=50").catch(() => ({ data: [] })),
      api("GET", "/agents").catch(() => ({ data: [] })),
      api("GET", "/vendors?scope=all").catch(() => ({ data: [] })),
      api("GET", "/policies").catch(() => ({ data: [] })),
      api("GET", "/webhooks").catch(() => ({ data: [] })),
    ]);
    state.counts.requests = reqs.data?.length || 0;
    state.counts.approvals = aprs.data?.length || 0;
    state.counts.agreements = agrs.data?.length || 0;
    state.counts.disputes = (dsps.data || []).filter((d) => d.status !== "resolved").length;
    state.counts.agents = ags.data?.length || 0;
    state.counts.vendors = vnds.data?.length || 0;
    state.counts.policies = pols.data?.length || 0;
    state.counts.webhooks = whs.data?.length || 0;
    document.querySelectorAll("[data-count-key]").forEach((el) => {
      const k = el.getAttribute("data-count-key");
      if (k && state.counts[k] !== undefined) el.textContent = String(state.counts[k]);
    });
    const bell = $("#bellCount");
    if (bell) {
      const n = state.counts.approvals + state.counts.disputes;
      bell.textContent = String(n);
      bell.style.display = n > 0 ? "grid" : "none";
    }
  } catch {}
}

  const activePersona = personaOptions.find(([, tok]) => tok === state.token);
  const avatarLetter = activePersona ? activePersona[2] : String(org.name || "C").charAt(0).toUpperCase();
  const escrowAddr = state.meta?.chain?.escrow || "0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0";

  $("#app").innerHTML = `

      <nav class="rail-btns" aria-label="Console modules">
        ${NAV_ITEMS.map(([id, label, icon]) => `

            <svg class="ric"><use href="#${esc(icon)}"/></svg>
            <span class="rail-tip">${esc(label)}</span>
          </button>
        `).join("")}
      </nav>
      <div class="rail-foot">
        <a class="rail-btn" href="${esc(landingHref())}" title="Back to website" type="button">
          <svg class="ric"><use href="#i-home"/></svg>
          <span class="rail-tip">Website</span>
        </a>
        <button class="rail-btn" id="railLogoutBtn" title="Disconnect & Sign out" type="button" style="margin-top:6px;color:#e74c3c">
          <svg class="ric"><use href="#i-back"/></svg>
          <span class="rail-tip">Sign Out</span>
        </button>
      </div>
    </aside>

    <div class="main-col">
      <header class="appbar">
        <div class="appbar-title">
          <h1>${esc(NAV_LABELS[state.tab] || "Overview")}</h1>
          <span class="mark-chip"><img src="/assets/logo.png" alt="" /></span>
          <span class="appbar-sub">${esc(org.name || "ProMeo Protocol")} · Mezo Chain 31611</span>
        </div>
        <div class="spacer"></div>
        <div class="appbar-controls">
          ${(org.walletAddress || store.get("apn.wallet")) ? `
            <span class="addr-chip" title="Connected wallet" style="background:rgba(109,63,234,0.12);color:var(--purple);font-weight:600">
              <span class="mono">${esc(short(org.walletAddress || store.get("apn.wallet"), 6))}</span>
            </span>
          ` : ""}
          <button class="icon-btn" id="bellBtn" title="Alerts — pending approvals and open disputes" type="button">
            <svg class="ric"><use href="#i-bell"/></svg>
            <span class="dot-badge" id="bellCount" style="display:none">0</span>
          </button>
          <span class="addr-chip">
            <span class="mono">${esc(short(escrowAddr, 6))}</span>
            <button class="copy-btn" id="copyEscrow" title="Copy settlement contract address" type="button">
              <svg class="ric"><use href="#i-copy"/></svg>
            </button>

/* =========================================================================
   Gauge with radial rays
   ========================================================================= */
function gaugeHtml(pct, bigText, subText) {
  const RAYS = 60;
  const lit = Math.max(0, Math.min(RAYS, Math.round((pct / 100) * RAYS)));
  let lines = "";
  for (let i = 0; i < RAYS; i++) {
    const a = (i / RAYS) * Math.PI * 2 - Math.PI / 2;
    const r1 = i % 5 === 0 ? 62 : 68;
    const r2 = 82;
    const x1 = 94 + Math.cos(a) * r1, y1 = 84 + Math.sin(a) * r1;
    const x2 = 94 + Math.cos(a) * r2, y2 = 84 + Math.sin(a) * r2;
    const on = i < lit;
    lines += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${on ? "#6d3fea" : "rgba(84,58,170,0.16)"}" stroke-width="${on ? 3.4 : 2.4}" stroke-linecap="round"/>`;
  }
  return `
    <div class="gauge-box">
      <div class="gauge-inner">
        <svg viewBox="0 0 188 168" aria-hidden="true">${lines}</svg>
        <div class="gauge-num">${esc(bigText)}</div>
        <div class="gauge-sub">${esc(subText)}</div>
      </div>
    </div>
  `;
}

/* =========================================================================
   Activity chart built from the real audit hash chain
   ========================================================================= */
function buildChartBuckets(range) {
  const now = Date.now();
  let buckets, span, labels;
  if (range === "d") { buckets = 24; span = 3600e3; }
  else if (range === "w") { buckets = 7; span = 86400e3; }
  else if (range === "m") { buckets = 30; span = 86400e3; }
  else { buckets = 12; span = 30 * 86400e3; }
  const counts = new Array(buckets).fill(0);
  for (const ts of state.chartData) {
    const idx = buckets - 1 - Math.floor((now - ts) / span);
    if (idx >= 0 && idx < buckets) counts[idx]++;
  }
  const cum = [];
  let run = 0;
  for (const c of counts) { run += c; cum.push(run); }
  const labelsArr = counts.map((_, i) => {
    const t = new Date(now - (buckets - 1 - i) * span);
    if (range === "d") return t.getHours() + ":00";
    if (range === "y") return t.toLocaleString("en", { month: "short" });
    return String(t.getDate()) + " " + t.toLocaleString("en", { month: "short" });
  });
  return { counts, cum, labels: labelsArr };
}

function renderActivityChart() {
  const { cum, counts, labels } = buildChartBuckets(state.range);
  const W = 640, H = 210, PADL = 8, PADR = 62, PADT = 14, PADB = 26;
  const maxV = Math.max(...cum, 1);
  const nice = Math.ceil(maxV * 1.15) || 5;
  const iw = W - PADL - PADR, ih = H - PADT - PADB;
  const x = (i) => PADL + (iw * i) / Math.max(1, cum.length - 1);
  const y = (v) => PADT + ih - (ih * v) / nice;

  let grid = "";
  for (let g = 0; g <= 4; g++) {
    const gv = (nice / 4) * g;
    const gy = y(gv);
    grid += `<line x1="${PADL}" y1="${gy}" x2="${PADL + iw}" y2="${gy}" stroke="rgba(84,58,170,0.18)" stroke-dasharray="3 6" stroke-width="1"/>`;
    grid += `<text x="${PADL + iw + 10}" y="${gy + 3.5}" font-size="10" fill="#7d76a0" font-family="Inter,sans-serif">${Math.round(gv).toLocaleString("en-US")}</text>`;
  }

  const pts = cum.map((v, i) => [x(i), y(v)]);
  let dPath = `M ${pts[0][0]} ${pts[0][1]}`;
  for (let i = 1; i < pts.length; i++) {
    const [px, py] = pts[i - 1], [cx2, cy2] = pts[i];
    const mx = (px + cx2) / 2;
    dPath += ` C ${mx} ${py}, ${mx} ${cy2}, ${cx2} ${cy2}`;
  }
  const area = dPath + ` L ${pts[pts.length - 1][0]} ${PADT + ih} L ${pts[0][0]} ${PADT + ih} Z`;
  const [ex, ey] = pts[pts.length - 1];

  const maxBar = Math.max(...counts, 1);
  const bw = iw / counts.length;
  let bars = "";
  for (let i = 0; i < counts.length; i++) {
    const bh = Math.max(2, (counts[i] / maxBar) * 30);
    bars += `<rect x="${(PADL + i * bw + bw * 0.22).toFixed(1)}" y="${(34 - bh).toFixed(1)}" width="${(bw * 0.56).toFixed(1)}" height="${bh.toFixed(1)}" rx="1.5" fill="rgba(109,63,234,0.8)"/>`;
  }
  let xlabels = "";
  const stepLbl = Math.ceil(labels.length / 6);
  for (let i = 0; i < labels.length; i += stepLbl) {
    xlabels += `<text x="${PADL + i * bw}" y="${46}" font-size="9.5" fill="#7d76a0" font-family="Inter,sans-serif">${esc(labels[i])}</text>`;
  }

  const el = $("#activityChart");
  if (el) {
    el.innerHTML = `
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:230px">
        <defs>
          <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="rgba(139,92,246,0.32)"/>
            <stop offset="1" stop-color="rgba(139,92,246,0.02)"/>
          </linearGradient>
        </defs>
        ${grid}
        <path d="${area}" fill="url(#areaGrad)"/>
        <path d="${dPath}" fill="none" stroke="#5a2fd6" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="${ex}" cy="${ey}" r="4.5" fill="#1c1436" stroke="#ffffff" stroke-width="2"/>
      </svg>
      <svg viewBox="0 0 ${W} 52" preserveAspectRatio="none" style="height:46px;margin-top:2px">
        ${bars}
        ${xlabels}
      </svg>
    `;
  }
}

function rangeVolume(agreements) {
  const span = state.range === "d" ? 86400e3 : state.range === "w" ? 7 * 86400e3 : state.range === "m" ? 30 * 86400e3 : 365 * 86400e3;
  const cutoff = Date.now() - span;
  let total = 0n;
  let any = false;
  for (const a of agreements) {
    const ts = Date.parse(a.createdAt || a.createdAtIso || "");
    if (Number.isFinite(ts) && ts >= cutoff) { total += BigInt(a.amount || "0"); any = true; }
  }
  if (!any) {
    for (const a of agreements) total += BigInt(a.amount || "0");
  }
  return total;
}

async function viewAgreements() {
  $("#view").innerHTML = `<div class="load-box">Loading on-chain escrow agreements…</div>`;

    api("GET", "/agreements?limit=50"),
    api("GET", "/requests?limit=50").catch(() => ({ data: [] })),
  ]);

  const approvedReqs = [];
  for (const r of (reqs.data || []).filter((x) => x.status === "approved")) {
    if (agrs.data.some((a) => a.requestId === r.id && a.state !== "cancelled")) continue;
    /* The awarded offer is the one whose status transitioned to "accepted" on award */
    const offs = await api("GET", `/requests/${r.id}/offers`).catch(() => ({ data: [] }));
    const acceptedOffer = (offs.data || []).find((o) => o.status === "accepted");
    if (acceptedOffer) approvedReqs.push({ ...r, acceptedOfferId: acceptedOffer.id, acceptedOfferPrice: acceptedOffer.priceAmountDisplay || fmt(acceptedOffer.priceAmount) });
  }

  if (!state.selectedAgreementId && agrs.data.length > 0) {
    state.selectedAgreementId = agrs.data[0].id;
  }

  $("#view").innerHTML = `
    ${pageHeader(
      "Non-Custodial Musd Escrow",

            <td class="mono">${esc(short(r.acceptedOfferId, 12))}</td>

            <td><button class="btn sm primary" data-propose-req="${esc(r.id)}" data-propose-offer="${esc(r.acceptedOfferId)}" type="button">Create escrow proposal</button></td>
          </tr>`
        )}

    ` : ""}

        <div class="card-head">
          <div>
            <h2>Escrow agreements (${agrs.data.length})</h2>

        </div>

            <td class="mono">${esc(a.amountDisplay || fmt(a.amount))} Musd</td>
            <td>${badge(a.state)}</td>
          </tr>`

      <div class="card" id="agrInspector">
        <div class="empty-box">Select an agreement on the left to inspect and execute on-chain settlement actions.</div>
      </div>
    </div>
  `;

  document.querySelectorAll("[data-propose-req]").forEach((btn) => {
    btn.onclick = async () => {
      try {
        const requestId = btn.getAttribute("data-propose-req");

        const res = await api("POST", "/agreements", { requestId, offerId });
        state.selectedAgreementId = res.agreement.id;

        await viewAgreements();

    const d = await api("GET", `/policies/${activeSummary.id}`).catch(() => null);
    activeDetail = d?.policy || null;
  }

  const rules = doc.rules || [];

  $("#view").innerHTML = `
    ${pageHeader(
      "Deterministic Spend Governance",
      "Immutable policy versions & rule simulator",
      "Policies use deny-overrides evaluation and canonical hashing. Every award decision records the exact policy version and hash."

          ${field("polHardMax", "Hard maximum ceiling (Musd)", { value: "25000" })}

        <div class="sep"></div>
        <h3 style="margin-bottom:10px">Policy version history (${pols.data.length})</h3>
        ${table(
          ["Version", "Status", "Document hash", "Activated", "Action"],
          pols.data,
          (p) => `<tr>
            <td style="color:var(--ink);font-weight:500">Version ${esc(p.version)}</td>
            <td>${badge(p.status)}</td>
            <td class="mono">${esc(short(p.hash, 12))}</td>
            <td>${esc(when(p.activatedAt || p.createdAt))}</td>
            <td>
              ${p.status !== "active"

        ["Rule id", "Priority", "Effect", "Description"],

          <td class="mono">${esc(r.priority)}</td>
          <td>${badge(r.effect)}</td>
          <td>${esc(r.description || "—")}</td>
        </tr>`
      )}
    </div>

  $("#btnRunSim").onclick = async () => {
    try {
      const amount = toBaseUnits($("#simAmount").value);
      const verified = $("#simVerified").value === "true";
      const trust = Number($("#simTrust").value || 2);
      const res = await api("POST", "/policies/simulate", {
        context: {
          amount,
          budgetAmount: toBaseUnits("10000"),
          category: $("#simCat").value,
          agentTrustLevel: trust,
          offerCount: 2,
          vendor: { id: "00000000-0000-0000-0000-000000000001", verified, tier: verified ? 3 : 1 },

      });

      $("#simResult").innerHTML = `
        <div style="padding:14px;border-radius:14px;background:#f3edff;border:1px solid rgba(109,63,234,0.32)">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">

            ${badge(ev.decision)}

        </div>

    } catch (e) { toast(e.message); }
  };

  $("#btnCreatePolicy").onclick = async () => {
    try {
      const autoMax = toBaseUnits($("#polAutoMax").value || "1000");
      const hardMax = toBaseUnits($("#polHardMax").value || "25000");
      const newDoc = {
        schemaVersion: 1,
        name: $("#polName").value.trim() || "Updated treasury policy",
        description: "Custom threshold policy created in console",
        defaultEffect: "deny",
        limits: {
          maxAmount: hardMax,
          minAmount: "1",
          allowedCategories: ["cloud_infrastructure", "software", "security", "data", "marketing", "logistics", "research", "professional_services", "other"],
        },
        approval: { requiredRoles: ["approver"], ttlMinutes: 1440 },
        rules: [
          {
            id: "verified-vendor-auto-custom",
            effect: "allow",
            priority: 60,
            description: `Verified vendors auto-approved up to ${$("#polAutoMax").value} Musd`,
            when: { all: [{ field: "vendor.verified", op: "eq", value: true }, { field: "amount", op: "lte", value: autoMax }] },
          },
          {
            id: "above-threshold-human-gate",
            effect: "require_human_approval",
            priority: 90,
            description: `Orders above ${$("#polAutoMax").value} Musd require a human approver`,
            when: { all: [{ field: "amount", op: "gt", value: autoMax }] },
          },
        ],
      };
      const created = await api("POST", "/policies", { document: newDoc });
      await api("POST", `/policies/${created.policy.id}/activate`, {});
      toast("Created and activated policy version " + created.policy.version);
      await refreshCounts();
      await viewPolicies();
    } catch (e) { toast(e.message); }
  };

  document.querySelectorAll("[data-act-pol]").forEach((btn) => {
    btn.onclick = async () => {
      try {
        await api("POST", `/policies/${btn.getAttribute("data-act-pol")}/activate`, {});
        toast("Activated selected policy version");
        await viewPolicies();
      } catch (e) { toast(e.message); }
    };
  });
}

   ========================================================================= */
const VIEWS = {
  overview: viewOverview,

  approvals: viewApprovals,

  disputes: viewDisputes,
  agents: viewAgents,

  org: viewOrg,

};

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

async function renderTab() {
  const fn = VIEWS[state.tab] || viewOverview;
  try {
    await fn();
  } catch (e) {
    const authIssue = /token|credential|unauthorized|401/i.test(String(e?.message || ""));
    $("#view").innerHTML = `
      <div class="card empty-box" style="padding:44px 20px">
        <div style="font-size:15px;font-weight:600;color:var(--ink);margin-bottom:6px">${authIssue ? "No active credential for this view" : "This view failed to load"}</div>
        <div style="max-width:520px;margin:0 auto 16px">${esc(e?.message || "Unknown error")}</div>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
          <button class="btn primary" id="errRetry" type="button">Retry now</button>
          <button class="btn subtle" id="errKeys" type="button">Manage credentials &amp; keys</button>
        </div>
      </div>`;
    $("#errRetry").onclick = () => renderTab();
    $("#errKeys").onclick = () => navigateTo("keys");
  }
}

async function loadOrg() {
  const r = await api("GET", "/org");
  state.org = r.org;
  state.role = r.role || (r.principal === "agent" ? "ai_agent" : "owner");
  state.principalKind = r.principal || "user";
}

/* Validate the current token against the live api; returns true when it authenticates */
async function tokenWorks() {
  if (!state.token) return false;
  try {
    await api("GET", "/org", undefined, state.token);
    return true;
  } catch {
    return false;
  }
}

function showBoot(message, sub) {
  if (!$("#view")) renderShell();
  const target = $("#view") || $("#app");
  if (!target) return;
  target.innerHTML = `
    <div class="card empty-box" style="padding:52px 20px">
      <div style="width:44px;height:44px;margin:0 auto 16px;border-radius:14px;background:var(--grad-btn);display:grid;place-items:center;box-shadow:0 10px 24px rgba(109,63,234,0.45)">
        <img src="/assets/logo.png" alt="" style="width:24px;height:24px;object-fit:contain" />
      </div>
      <div style="font-size:15px;font-weight:600;color:var(--ink);margin-bottom:4px">${esc(message)}</div>
      <div class="muted" style="max-width:460px;margin:0 auto 18px">${esc(sub || "The dashboard will connect automatically as soon as the protocol api responds.")}</div>
      <button class="btn primary" id="bootRetry" type="button">Retry connection</button>
    </div>`;
  const btn = $("#bootRetry");
  if (btn) btn.onclick = () => boot();
}

async function boot() {
  renderShell();
  showBoot("Connecting to the protocol api…");

  /* 1. Reach the api — retry across restarts instead of failing silently */
  let meta = null, health = null, bootStatus = null;
  for (let attempt = 1; attempt <= 20; attempt++) {
    try {
      const [m, h, b] = await Promise.all([
        fetch("/v1/meta").then((r) => r.json()),
        fetch("/healthz").then((r) => r.json()),
        fetch("/v1/bootstrap/status?ensure=1").then((r) => r.json()),
      ]);
      meta = m || {}; health = h || {}; bootStatus = b || {};
      if (bootStatus?.demoPrincipals || state.token || (meta && health)) break;
    } catch {
      showBoot(
        "Connecting to the protocol api… (attempt " + attempt + " of 20)",
        "The api on this port is still starting or restarting. The dashboard retries automatically every second and a half."
      );
      await sleep(1500);
    }
  }
  state.meta = meta;
  state.health = health;
  state.demoPrincipals = bootStatus?.demoPrincipals || null;

  if (!state.meta && !state.demoPrincipals) {
    showBoot("The protocol api is unreachable", "Start the Protocol Console service on this port, then press retry.");
    return;
  }

function showAuthRequired() {
  const appEl = $("#app");
  if (appEl) {
    appEl.style.display = "flex";
    appEl.style.alignItems = "center";
    appEl.style.justifyContent = "center";
    appEl.style.minHeight = "100vh";
    appEl.style.padding = "24px";
  }
  appEl.innerHTML = `
    <div style="width:100%;max-width:520px;margin:auto">
      <div class="card" style="width:100%;text-align:center;padding:48px 32px;border-radius:var(--r-xl);box-shadow:var(--shadow);border:1px solid rgba(255,255,255,0.8);background:rgba(255,255,255,0.94);backdrop-filter:blur(24px)">
        <div style="width:62px;height:62px;margin:0 auto 20px;border-radius:20px;background:var(--grad-btn);display:grid;place-items:center;box-shadow:0 12px 30px rgba(109,63,234,0.45)">
          <img src="/assets/logo.png" alt="ProMeo" style="width:34px;height:34px;object-fit:contain" />
        </div>
        <h2 style="font-size:22px;font-weight:700;color:var(--ink);margin-bottom:8px;letter-spacing:-0.02em">Welcome to ProMeo Console</h2>
        <p class="muted" style="margin-bottom:24px;font-size:13.5px;line-height:1.6">
          Autonomous AI Agent Procurement on Mezo Testnet (Chain ID 31611). Connect your wallet or launch an operator workspace to test end to end.
        </p>
        <div style="display:flex;flex-direction:column;gap:10px">
          ${window.ethereum ? `
            <button class="btn primary" id="btnConnectInjected" style="display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;font-size:14.5px;font-weight:600;border-radius:var(--r-md);box-shadow:0 8px 24px rgba(109,63,234,0.35);cursor:pointer" type="button">
              <svg class="ric" style="width:18px;height:18px"><use href="#i-spark"/></svg>
              <span>Connect Browser Wallet (MetaMask / Injected)</span>
            </button>
          ` : ""}
          <button class="btn subtle" id="btnConnectDemo" style="display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;font-size:14px;font-weight:600;border-radius:var(--r-md);cursor:pointer;background:#efe9ff;color:var(--purple);border:1px solid rgba(109,63,234,0.25)" type="button">
            <span>Launch Operator Session (One-Click)</span>
          </button>
          <a class="btn" href="/?connect=1" style="display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;font-size:13.5px;color:var(--ink-soft);border:1px solid var(--line-strong);border-radius:var(--r-md)">
            <span>Connect via Reown AppKit</span>
          </a>
          <a class="btn subtle" href="/" style="display:flex;justify-content:center;padding:10px;font-size:13px;color:var(--muted)">
            Back to Home
          </a>
        </div>
      </div>
    </div>
  `;

  if ($("#btnConnectInjected")) {
    $("#btnConnectInjected").onclick = async () => {
      try {
        const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
        if (accounts && accounts[0]) {
          const authRes = await api("POST", "/auth/wallet", { walletAddress: accounts[0] });
          state.token = authRes.token;
          store.set("apn.token", authRes.token);
          localStorage.setItem("apn.token", authRes.token);
          localStorage.setItem("apn.wallet", accounts[0]);
          await boot();
        }
      } catch (err) {
        toast("Wallet connection failed: " + err.message);
      }
    };
  }

  if ($("#btnConnectDemo")) {
    $("#btnConnectDemo").onclick = async () => {
      state.token = state.demoPrincipals?.northwind_owner || "apn_u_operator_session";
      store.set("apn.token", state.token);
      localStorage.setItem("apn.token", state.token);
      await boot();
    };
  }
}

  /* 2. Establish a working credential — verify the stored one */
  if (!state.token) {
    try {
      const ls = localStorage.getItem("apn.token");
      const wallet = localStorage.getItem("apn.wallet");
      if (ls) {
        state.token = ls;
        store.set("apn.token", ls);
      } else if (wallet) {
        const authRes = await api("POST", "/auth/wallet", { walletAddress: wallet }).catch(() => null);
        if (authRes?.token) {
          state.token = authRes.token;
          store.set("apn.token", authRes.token);
          localStorage.setItem("apn.token", authRes.token);
        }
      }
    } catch {}
  }

  let works = await tokenWorks();
  if (!works && state.demoPrincipals?.northwind_owner) {
    state.token = state.demoPrincipals.northwind_owner;
    store.set("apn.token", state.token);
    works = await tokenWorks();
  }
  if (!works) {
    showAuthRequired();
    return;
  }

  try { await loadOrg(); } catch {}

  renderShell();
  await refreshCounts();
  await renderTab();
}

boot();

</script>
</body>
</html>
